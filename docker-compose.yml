services:
  mysql:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
      args:
        MYSQL_VERSION: "8.4"
    container_name: chat-p2p-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chat_p2p}
      MYSQL_USER: ${MYSQL_USER:-chat_p2p}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chat_p2p_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - chat-p2p-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  chat-p2p-mysql-data:
