# Cau hinh mac dinh cua client - file nay duoc dong goi vao jar, KHONG dat bi mat o day.
#
# TURN server (fallback khi ICE truc tiep that bai) - cau hinh bang MOT trong cac cach:
#   1. Bien moi truong: CHAT_P2P_TURN_HOST, CHAT_P2P_TURN_PORT,
#      CHAT_P2P_TURN_USERNAME, CHAT_P2P_TURN_PASSWORD
#   2. -D system property cung ten (vd -DCHAT_P2P_TURN_HOST=...)
#   3. File cuc bo ~/.chat-p2p-java/client.properties voi cac khoa:
#        chat.p2p.turn.host=...
#        chat.p2p.turn.port=3478
#        chat.p2p.turn.username=...
#        chat.p2p.turn.password=...
# De trong ca 4 gia tri = khong dung TURN (chi ICE truc tiep qua STUN).
