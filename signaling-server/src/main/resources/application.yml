server:
  port: 8080

spring:
  application:
    name: chat-p2p-signaling-server
  datasource:
    url: ${CHAT_P2P_DB_URL}
    username: ${CHAT_P2P_DB_USERNAME}
    password: ${CHAT_P2P_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

logging:
  level:
    com.datn.chatp2p: INFO

chat-p2p:
  auth:
    required: ${CHAT_P2P_AUTH_REQUIRED:true}
